name: Retire obsolete automation sessions

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: legacy-codex-retirement
  cancel-in-progress: false

jobs:
  retire:
    if: github.repository == 'Conduit-BTC/conduit-mono' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: legacy-codex-retirement
    steps:
      - name: Revoke and verify obsolete sessions
        env:
          LEGACY_CODEX_AUTH: ${{ secrets.CODEX_AUTH_JSON }}
          LEGACY_SUDDEN_AUTH: ${{ secrets.SUDDEN_AGENT_AUTH_FILE }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - LEGACY_CODEX_AUTH LEGACY_SUDDEN_AUTH <<'PYTHON'
          """Retire saved legacy sessions without logging credentials or server responses."""
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          AUTH_ORIGIN = "https://auth.openai.com"
          CLIENT_ID = "app_EMoamEEZ73f0CkXaXp7hrann"


          class RetirementError(Exception):
              """A fixed diagnostic safe for workflow output."""


          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None


          def post(path, payload):
              request = urllib.request.Request(
                  AUTH_ORIGIN + path, data=json.dumps(payload).encode(),
                  headers={"Content-Type": "application/json", "originator": "codex_cli_rs",
                           "User-Agent": "conduit-trusted-session-retirement/1.0"}, method="POST",
              )
              try:
                  with urllib.request.build_opener(NoRedirect()).open(request, timeout=10) as response:
                      return response.status, response.read(65537)
              except urllib.error.HTTPError as error:
                  return error.code, error.read(65537)
              except Exception:
                  raise RetirementError("network-failure") from None


          def decode(body):
              try:
                  value = json.loads(body)
              except Exception:
                  raise RetirementError("invalid-response") from None
              if not isinstance(value, dict) or len(body) > 65536:
                  raise RetirementError("invalid-response")
              return value


          def revoke(token, hint, send=post):
              payload = {"token": token, "token_type_hint": hint}
              if hint == "refresh_token":
                  payload["client_id"] = CLIENT_ID
              status, _ = send("/oauth/revoke", payload)
              if not 200 <= status < 300:
                  raise RetirementError("revoke-rejected")


          def retire(raw, send=post):
              try:
                  auth = json.loads(raw)
                  tokens = auth["tokens"]
                  refresh = tokens["refresh_token"]
                  access = tokens["access_token"]
                  if (auth.get("auth_mode") not in (None, "chatgpt") or
                          auth.get("OPENAI_API_KEY") or
                          not isinstance(refresh, str) or not refresh.strip() or
                          not isinstance(access, str) or not access.strip()):
                      raise ValueError()
              except Exception:
                  raise RetirementError("invalid-legacy-auth") from None

              # Match the official Codex 0.145.0 revocation and refresh contracts.
              revoke(refresh, "refresh_token", send)
              revoke(access, "access_token", send)
              status, body = send("/oauth/token", {
                  "client_id": CLIENT_ID, "grant_type": "refresh_token",
                  "refresh_token": refresh,
              })
              result = decode(body)
              if 200 <= status < 300:
                  # Never leave an unexpectedly issued credential active or persist it.
                  failed = False
                  for field in ("refresh_token", "access_token"):
                      token = result.get(field)
                      if isinstance(token, str) and token.strip():
                          try:
                              revoke(token, field, send)
                          except RetirementError:
                              failed = True
                  raise RetirementError("unexpected-refresh-cleanup-failed" if failed
                                        else "unexpected-refresh-success")
              error = result.get("error")
              code = error.get("code") if isinstance(error, dict) else error
              if not isinstance(code, str):
                  code = result.get("code")
              if status not in (400, 401) or not isinstance(code, str) or code.lower() != "refresh_token_invalidated":
                  raise RetirementError("revocation-unverified")


          def main():
              # The workflow uses a separate environment with no new bootstrap secret.
              if not sys.argv[1:]:
                  raise RetirementError("missing-secret-selection")
              if any(name not in ("LEGACY_CODEX_AUTH", "LEGACY_SUDDEN_AUTH") for name in sys.argv[1:]):
                  raise RetirementError("invalid-secret-selection")
              failed = False
              for name in sys.argv[1:]:
                  raw = os.environ.pop(name, "")
                  try:
                      if not raw:
                          raise RetirementError("missing-legacy-auth")
                      retire(raw)
                      print(name + ": revocation-verified", flush=True)
                  except RetirementError as error:
                      failed = True
                      print(name + ": " + str(error), file=sys.stderr, flush=True)
                  except Exception:
                      failed = True
                      print(name + ": internal-error", file=sys.stderr, flush=True)
              if failed:
                  raise RetirementError("one-or-more-sessions-unverified")


          if __name__ == "__main__":
              try:
                  main()
              except RetirementError as error:
                  print("Legacy retirement failed: " + str(error), file=sys.stderr)
                  sys.exit(1)
              except Exception:
                  print("Legacy retirement failed: internal-error", file=sys.stderr)
                  sys.exit(1)
          PYTHON
