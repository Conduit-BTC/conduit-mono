name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - run: bun install --frozen-lockfile
      - name: Check formatting on changed files
        shell: bash
        run: |
          set -euo pipefail

          if [[ '${{ github.event_name }}' == 'pull_request' ]]; then
            raw_base_sha='${{ github.event.pull_request.base.sha }}'
            head_sha='${{ github.event.pull_request.head.sha }}'
            base_sha="$(git merge-base "$raw_base_sha" "$head_sha" 2>/dev/null || true)"
          else
            base_sha='${{ github.event.before }}'
            head_sha='${{ github.sha }}'
          fi

          if [[ -z "$base_sha" || "$base_sha" == '0000000000000000000000000000000000000000' ]]; then
            base_sha="$(git rev-parse "${head_sha}^" 2>/dev/null || true)"
          fi

          if [[ -z "$base_sha" ]]; then
            echo "No base SHA available; skipping changed-file format check."
            exit 0
          fi

          bun scripts/ci/prettier_changed.ts --check --base "$base_sha" --head "$head_sha"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - run: bun install --frozen-lockfile
      - run: bun run lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - run: bun install --frozen-lockfile
      - run: bun test
        env:
          SMOKE_CREDENTIAL_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          SMOKE_CREDENTIAL_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

  color-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - run: bun install --frozen-lockfile
      - name: Enforce no hardcoded colors outside theme.css
        run: bun test tests/no-hardcoded-colors.test.ts

  telemetry-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - run: bun install --frozen-lockfile
      - name: Enforce privacy-safe telemetry policy
        run: bun run telemetry:check

  smoke-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.select.outputs.shards }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - name: Select affected smoke shards
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RAW_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "push" ]]; then
            shards="$(bun scripts/ci/select_smoke_shards.ts --all)"
          else
            base_sha="$(git merge-base "$RAW_BASE_SHA" "$HEAD_SHA")"
            shards="$(bun scripts/ci/select_smoke_shards.ts --base "$base_sha" --head "$HEAD_SHA")"
          fi

          echo "Selected smoke shards: $shards"
          echo "shards=$shards" >> "$GITHUB_OUTPUT"

  e2e-smoke-shard:
    name: e2e-smoke / ${{ matrix.job.id }}
    needs: [smoke-changes]
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.smoke-changes.outputs.shards) }}
    runs-on: ubuntu-latest
    # Keep this version aligned with the locked @playwright/test dependency.
    # Preinstalled browsers/libraries avoid slow apt downloads on every shard.
    container:
      image: ${{ matrix.job.area != 'none' && 'mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e' || '' }}
      options: --init --shm-size=1g
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    steps:
      - name: No browser smoke needed
        if: matrix.job.area == 'none'
        run: echo "No browser-facing runtime paths changed."
      - uses: actions/checkout@v7.0.1
        if: matrix.job.area != 'none'
        with:
          persist-credentials: false
      - name: Set up Bun and checkout ownership
        if: matrix.job.area != 'none'
        run: |
          set -euo pipefail
          # The Playwright image has npm, but not setup-bun's unzip dependency.
          npm install --global bun@1.3.5
          bun --version
          # GitHub mounts the checkout with a different owner inside the image.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - if: matrix.job.area != 'none'
        run: bun install --frozen-lockfile
      - name: Validate Playwright smoke area assignments
        if: matrix.job.area != 'none'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PLAYWRIGHT_SMOKE_MANIFEST: playwright-smoke-${{ matrix.job.id }}-manifest.json
          PLAYWRIGHT_SMOKE_SHARD: ${{ matrix.job.shard }}
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          checkout_sha="$(git rev-parse HEAD)"
          if [[ "$checkout_sha" != "$TESTED_SHA" ]]; then
            echo "The checked-out SHA does not match the workflow-tested SHA." >&2
            exit 1
          fi
          shard_args=()
          if [[ -n "$PLAYWRIGHT_SMOKE_SHARD" ]]; then
            shard_args=(--shard "$PLAYWRIGHT_SMOKE_SHARD")
          fi
          bun run test:e2e:areas \
            --area '${{ matrix.job.area }}' \
            "${shard_args[@]}" \
            --manifest-output "$PLAYWRIGHT_SMOKE_MANIFEST" \
            --source-head-sha "$SOURCE_HEAD_SHA" \
            --base-sha "$BASE_SHA" \
            --tested-sha "$checkout_sha"
      - name: Run ${{ matrix.job.id }} Playwright smoke tests
        if: matrix.job.area != 'none'
        env:
          PLAYWRIGHT_SMOKE_AREA: ${{ matrix.job.area }}
          PLAYWRIGHT_SMOKE_SHARD: ${{ matrix.job.shard }}
          PLAYWRIGHT_SMOKE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PLAYWRIGHT_SMOKE_RESULT_FILE: ${{ runner.temp }}/playwright-smoke-${{ matrix.job.id }}-results.json
          PLAYWRIGHT_SMOKE_PROGRESS_FILE: ${{ runner.temp }}/playwright-smoke-${{ matrix.job.id }}-progress.log
          PLAYWRIGHT_SMOKE_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PLAYWRIGHT_SMOKE_TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          : > "$PLAYWRIGHT_SMOKE_PROGRESS_FILE"
          tail -n +1 -f "$PLAYWRIGHT_SMOKE_PROGRESS_FILE" &
          progress_pid=$!
          trap 'sleep 1; kill "$progress_pid" 2>/dev/null || true' EXIT
          if [[ -n "$PLAYWRIGHT_SMOKE_SHARD" ]]; then
            bunx playwright test --shard="$PLAYWRIGHT_SMOKE_SHARD" >/dev/null 2>&1
          else
            bunx playwright test >/dev/null 2>&1
          fi
      - name: Verify executed ${{ matrix.job.id }} Playwright smoke evidence
        if: always() && matrix.job.area != 'none'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PLAYWRIGHT_SMOKE_MANIFEST: playwright-smoke-${{ matrix.job.id }}-manifest.json
          PLAYWRIGHT_SMOKE_RESULT_FILE: ${{ runner.temp }}/playwright-smoke-${{ matrix.job.id }}-results.json
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          checkout_sha="$(git rev-parse HEAD)"
          if [[ "$checkout_sha" != "$TESTED_SHA" ]]; then
            echo "The checked-out SHA changed during Playwright execution." >&2
            exit 1
          fi
          bun run test:e2e:areas \
            --area '${{ matrix.job.area }}' \
            --expected-manifest "$PLAYWRIGHT_SMOKE_MANIFEST" \
            --execution-report "$PLAYWRIGHT_SMOKE_RESULT_FILE" \
            --source-head-sha "$SOURCE_HEAD_SHA" \
            --base-sha "$BASE_SHA" \
            --tested-sha "$checkout_sha"
      # The router uses a distinct isolated app/provider profile, not the
      # ordinary Commerce network lane. Both must pass the required aggregate.
      - name: Validate isolated router smoke selection
        if: matrix.job.area == 'commerce'
        env:
          PLAYWRIGHT_SMOKE_AREA: commerce
          PLAYWRIGHT_SMOKE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PLAYWRIGHT_SMOKE_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PLAYWRIGHT_SMOKE_TESTED_SHA: ${{ github.sha }}
          PLAYWRIGHT_SMOKE_MANIFEST: playwright-router-smoke-manifest.json
        run: |
          set -euo pipefail
          checkout_sha="$(git rev-parse HEAD)"
          if [[ "$checkout_sha" != "$PLAYWRIGHT_SMOKE_TESTED_SHA" ]]; then
            echo "The checked-out SHA does not match the workflow-tested SHA." >&2
            exit 1
          fi
          bun run test:e2e:areas \
            --config playwright.router.config.ts \
            --area commerce \
            --manifest-output "$PLAYWRIGHT_SMOKE_MANIFEST" \
            --source-head-sha "$PLAYWRIGHT_SMOKE_SOURCE_HEAD_SHA" \
            --base-sha "$PLAYWRIGHT_SMOKE_BASE_SHA" \
            --tested-sha "$checkout_sha"
      - name: Run isolated router Playwright smoke tests
        if: matrix.job.area == 'commerce'
        env:
          PLAYWRIGHT_SMOKE_AREA: commerce
          PLAYWRIGHT_SMOKE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PLAYWRIGHT_SMOKE_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PLAYWRIGHT_SMOKE_TESTED_SHA: ${{ github.sha }}
          PLAYWRIGHT_SMOKE_RESULT_FILE: ${{ runner.temp }}/playwright-router-smoke-results.json
          PLAYWRIGHT_SMOKE_PROGRESS_FILE: ${{ runner.temp }}/playwright-router-smoke-progress.log
        run: |
          set -euo pipefail
          umask 077
          : > "$PLAYWRIGHT_SMOKE_PROGRESS_FILE"
          tail -n +1 -f "$PLAYWRIGHT_SMOKE_PROGRESS_FILE" &
          progress_pid=$!
          trap 'sleep 1; kill "$progress_pid" 2>/dev/null || true' EXIT
          bunx playwright test --config playwright.router.config.ts >/dev/null 2>&1
      - name: Verify executed isolated router smoke evidence
        if: always() && matrix.job.area == 'commerce'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TESTED_SHA: ${{ github.sha }}
          PLAYWRIGHT_SMOKE_MANIFEST: playwright-router-smoke-manifest.json
          PLAYWRIGHT_SMOKE_RESULT_FILE: ${{ runner.temp }}/playwright-router-smoke-results.json
        run: |
          set -euo pipefail
          checkout_sha="$(git rev-parse HEAD)"
          if [[ "$checkout_sha" != "$TESTED_SHA" ]]; then
            echo "The checked-out SHA changed during Playwright execution." >&2
            exit 1
          fi
          bun run test:e2e:areas \
            --config playwright.router.config.ts \
            --area commerce \
            --expected-manifest "$PLAYWRIGHT_SMOKE_MANIFEST" \
            --execution-report "$PLAYWRIGHT_SMOKE_RESULT_FILE" \
            --source-head-sha "$SOURCE_HEAD_SHA" \
            --base-sha "$BASE_SHA" \
            --tested-sha "$checkout_sha"
      - name: Validate router receiver setup smoke selection
        if: matrix.job.area == 'commerce'
        env:
          PLAYWRIGHT_ROUTER_RECEIVER_SETUP_CASE: "true"
          PLAYWRIGHT_SMOKE_AREA: commerce
          PLAYWRIGHT_SMOKE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PLAYWRIGHT_SMOKE_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PLAYWRIGHT_SMOKE_TESTED_SHA: ${{ github.sha }}
          PLAYWRIGHT_SMOKE_MANIFEST: playwright-router-receiver-setup-manifest.json
        run: |
          set -euo pipefail
          checkout_sha="$(git rev-parse HEAD)"
          if [[ "$checkout_sha" != "$PLAYWRIGHT_SMOKE_TESTED_SHA" ]]; then
            echo "The checked-out SHA does not match the workflow-tested SHA." >&2
            exit 1
          fi
          bun run test:e2e:areas \
            --config playwright.router.config.ts \
            --area commerce \
            --manifest-output "$PLAYWRIGHT_SMOKE_MANIFEST" \
            --source-head-sha "$PLAYWRIGHT_SMOKE_SOURCE_HEAD_SHA" \
            --base-sha "$PLAYWRIGHT_SMOKE_BASE_SHA" \
            --tested-sha "$checkout_sha"
      - name: Run router receiver setup Playwright smoke
        if: matrix.job.area == 'commerce'
        env:
          PLAYWRIGHT_ROUTER_RECEIVER_SETUP_CASE: "true"
          PLAYWRIGHT_SMOKE_AREA: commerce
          PLAYWRIGHT_SMOKE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PLAYWRIGHT_SMOKE_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PLAYWRIGHT_SMOKE_TESTED_SHA: ${{ github.sha }}
          PLAYWRIGHT_SMOKE_RESULT_FILE: ${{ runner.temp }}/playwright-router-receiver-setup-results.json
          PLAYWRIGHT_SMOKE_PROGRESS_FILE: ${{ runner.temp }}/playwright-router-receiver-setup-progress.log
        run: |
          set -euo pipefail
          umask 077
          : > "$PLAYWRIGHT_SMOKE_PROGRESS_FILE"
          tail -n +1 -f "$PLAYWRIGHT_SMOKE_PROGRESS_FILE" &
          progress_pid=$!
          trap 'sleep 1; kill "$progress_pid" 2>/dev/null || true' EXIT
          bunx playwright test --config playwright.router.config.ts >/dev/null 2>&1
      - name: Verify executed router receiver setup smoke evidence
        if: always() && matrix.job.area == 'commerce'
        env:
          PLAYWRIGHT_ROUTER_RECEIVER_SETUP_CASE: "true"
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TESTED_SHA: ${{ github.sha }}
          PLAYWRIGHT_SMOKE_MANIFEST: playwright-router-receiver-setup-manifest.json
          PLAYWRIGHT_SMOKE_RESULT_FILE: ${{ runner.temp }}/playwright-router-receiver-setup-results.json
        run: |
          set -euo pipefail
          checkout_sha="$(git rev-parse HEAD)"
          if [[ "$checkout_sha" != "$TESTED_SHA" ]]; then
            echo "The checked-out SHA changed during Playwright execution." >&2
            exit 1
          fi
          bun run test:e2e:areas \
            --config playwright.router.config.ts \
            --area commerce \
            --expected-manifest "$PLAYWRIGHT_SMOKE_MANIFEST" \
            --execution-report "$PLAYWRIGHT_SMOKE_RESULT_FILE" \
            --source-head-sha "$SOURCE_HEAD_SHA" \
            --base-sha "$BASE_SHA" \
            --tested-sha "$checkout_sha"
      - name: Remove raw Playwright output
        if: always() && matrix.job.area != 'none'
        env:
          PLAYWRIGHT_SMOKE_RESULT_FILE: ${{ runner.temp }}/playwright-smoke-${{ matrix.job.id }}-results.json
          PLAYWRIGHT_SMOKE_PROGRESS_FILE: ${{ runner.temp }}/playwright-smoke-${{ matrix.job.id }}-progress.log
          PLAYWRIGHT_ROUTER_RESULT_FILE: ${{ runner.temp }}/playwright-router-smoke-results.json
          PLAYWRIGHT_ROUTER_PROGRESS_FILE: ${{ runner.temp }}/playwright-router-smoke-progress.log
          PLAYWRIGHT_ROUTER_MANIFEST: playwright-router-smoke-manifest.json
          PLAYWRIGHT_ROUTER_RECEIVER_RESULT_FILE: ${{ runner.temp }}/playwright-router-receiver-setup-results.json
          PLAYWRIGHT_ROUTER_RECEIVER_PROGRESS_FILE: ${{ runner.temp }}/playwright-router-receiver-setup-progress.log
          PLAYWRIGHT_ROUTER_RECEIVER_MANIFEST: playwright-router-receiver-setup-manifest.json
        run: |
          rm -f -- "$PLAYWRIGHT_SMOKE_RESULT_FILE" "$PLAYWRIGHT_SMOKE_PROGRESS_FILE"
          rm -f -- "$PLAYWRIGHT_ROUTER_RESULT_FILE" "$PLAYWRIGHT_ROUTER_PROGRESS_FILE" "$PLAYWRIGHT_ROUTER_MANIFEST"
          rm -f -- "$PLAYWRIGHT_ROUTER_RECEIVER_RESULT_FILE" "$PLAYWRIGHT_ROUTER_RECEIVER_PROGRESS_FILE" "$PLAYWRIGHT_ROUTER_RECEIVER_MANIFEST"
          rm -rf -- "$GITHUB_WORKSPACE/playwright-report" "$GITHUB_WORKSPACE/test-results"
  e2e-smoke:
    name: e2e-smoke
    if: always()
    needs: [smoke-changes, e2e-smoke-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify selected smoke shards
        env:
          SELECT_RESULT: ${{ needs.smoke-changes.result }}
          SHARD_RESULT: ${{ needs.e2e-smoke-shard.result }}
          SHARDS: ${{ needs.smoke-changes.outputs.shards }}
        run: |
          set -euo pipefail

          if [[ "$SELECT_RESULT" != "success" ]]; then
            echo "Smoke shard selection did not succeed: $SELECT_RESULT"
            exit 1
          fi
          if [[ "$SHARD_RESULT" != "success" ]]; then
            echo "Smoke shards did not complete successfully: $SHARD_RESULT"
            exit 1
          fi

          echo "Smoke shard result: $SHARD_RESULT for $SHARDS"

  build-mainnet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [format, lint, typecheck, test, color-policy, telemetry-policy]
    outputs:
      public-config-digest: ${{ steps.deployment-contract.outputs.public-config-digest }}
    env:
      CONDUIT_DEPLOYMENT_PROFILE: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      VITE_BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      VITE_BUILD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - run: bun install --frozen-lockfile
      - name: Build validated deployment profile
        run: bun run build
      - name: Verify compiled deployment manifests
        id: deployment-contract
        run: bun scripts/ci/verify_deployment_artifacts.ts "$CONDUIT_DEPLOYMENT_PROFILE"

  preview-links:
    name: >-
      ${{
        (github.event.pull_request.user.type != 'Bot' ||
          (vars.CONTRIBUTOR_REFRESH_BOT_LOGIN != '' &&
            github.event.pull_request.user.login == vars.CONTRIBUTOR_REFRESH_BOT_LOGIN &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.head.ref == 'chore/refresh-repository-contributors')) &&
          'preview-links' ||
          format('preview-links-ineligible-{0}', github.run_id)
      }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [build-mainnet]
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Skip preview links for fork PRs
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "Preview link verification is skipped for fork PRs because Cloudflare Pages does not publish same-repository preview checks for fork heads."

      - uses: actions/checkout@v7.0.1
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          persist-credentials: false

      - name: Verify contributor refresh scope
        if: >-
          vars.CONTRIBUTOR_REFRESH_BOT_LOGIN != '' &&
          github.event.pull_request.user.login == vars.CONTRIBUTOR_REFRESH_BOT_LOGIN &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'chore/refresh-repository-contributors'
        uses: actions/github-script@v9
        env:
          CONTRIBUTOR_REFRESH_BOT_LOGIN: ${{ vars.CONTRIBUTOR_REFRESH_BOT_LOGIN }}
        with:
          script: |
            const { data: policy } = await github.rest.repos.getContent({
              ...context.repo, path: "scripts/ci/contributor_refresh_pr.mjs",
              ref: context.payload.pull_request.base.sha,
            });
            const { assertContributorRefreshPullRequest } = await import(
              `data:text/javascript;base64,${policy.content.replace(/\s/g, "")}`
            );
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: context.issue.number,
            });
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo, pull_number: pr.number, per_page: 100,
            });
            assertContributorRefreshPullRequest(pr, files, `${context.repo.owner}/${context.repo.repo}`, process.env.CONTRIBUTOR_REFRESH_BOT_LOGIN);
            if (pr.head.sha !== context.payload.pull_request.head.sha) {
              throw new Error("The refresh PR head changed during preview verification.");
            }

      - name: Verify mainnet preview links
        if: github.event.pull_request.head.repo.full_name == github.repository
        id: preview-links
        uses: actions/github-script@v9
        env:
          EXPECTED_PUBLIC_CONFIG_DIGEST: ${{ needs.build-mainnet.outputs.public-config-digest }}
        with:
          script: |
            const { waitForProjectRows } = await import(
              `${process.env.GITHUB_WORKSPACE}/scripts/ci/preview_links.mjs`
            );
            const headSha = context.payload.pull_request.head.sha;
            const prBody = context.payload.pull_request.body || "";
            const markerPattern = /<!--\s*preview:show-commit-links-cloudflare\s*-->\s*-\s*\[(x|X)\]/i;
            const preferredPattern = /-\s*\[(x|X)\]\s*Show commit-level mainnet preview links \(Cloudflare creates deployments automatically\)\b/i;
            const legacyPattern = /-\s*\[(x|X)\]\s*Show commit preview links \(Cloudflare creates deployments automatically\)\b/i;
            const commitPreviewEnabled = markerPattern.test(prBody) || preferredPattern.test(prBody) || legacyPattern.test(prBody);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const updatedAt = new Date().toISOString().replace("T", " ").replace(/\.\d{3}Z$/, " UTC");
            const expectedConfigDigest = process.env.EXPECTED_PUBLIC_CONFIG_DIGEST || "";
            const { readFile } = await import("node:fs/promises");
            const profiles = JSON.parse(await readFile(
              `${process.env.GITHUB_WORKSPACE}/deploy/pages-profiles.json`, "utf8"
            ));
            const expectedRouterEnabled = profiles.profiles.preview.publicFeatures.quantumRouterEnabled;
            if (typeof expectedRouterEnabled !== "boolean") {
              throw new Error("The preview router capability is not explicit.");
            }
            if (!expectedConfigDigest) {
              throw new Error("The validated build did not expose a public config digest.");
            }

            const PROJECTS = {
              market: {
                label: "Market",
                project: "conduit-market",
              },
              merchant: {
                label: "Merchant",
                project: "conduit-merchant",
              },
            };

            async function listIssueComments() {
              return github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              });
            }

            const { rows } = await waitForProjectRows({
              listComments: listIssueComments,
              projects: PROJECTS,
              headSha,
            });

            async function verifyDeployedPreview(row) {
              const manifestUrl = new URL("/.well-known/conduit-deployment.json", row.branchUrl);
              let lastFailure = "deployment manifest was not available";

              for (let attempt = 1; attempt <= 30; attempt += 1) {
                manifestUrl.searchParams.set("commit", headSha);
                manifestUrl.searchParams.set("attempt", String(attempt));
                try {
                  const response = await fetch(manifestUrl, {
                    cache: "no-store",
                    signal: AbortSignal.timeout(10_000),
                  });
                  if (!response.ok) {
                    lastFailure = `HTTP ${response.status}`;
                  } else {
                    const manifest = await response.json();
                    const failures = [];
                    if (manifest.schemaVersion !== 1) failures.push("schemaVersion");
                    if (manifest.app !== row.app) failures.push("app");
                    if (manifest.deploymentProfile !== "preview") failures.push("deploymentProfile");
                    if (manifest.commitSha !== headSha) failures.push("commitSha");
                    if (manifest.publicConfigDigest !== expectedConfigDigest) failures.push("publicConfigDigest");
                    if (manifest.publicFeatures?.dmCompatibilityOrderRoutingEnabled !== true) {
                      failures.push("dmCompatibilityOrderRoutingEnabled");
                    }
                    if (manifest.publicFeatures?.livePresenceEnabled !== true) {
                      failures.push("livePresenceEnabled");
                    }
                    if (manifest.publicFeatures?.quantumRouterEnabled !== expectedRouterEnabled) {
                      failures.push("quantumRouterEnabled");
                    }
                    if (failures.length === 0) {
                      return manifestUrl.toString();
                    }
                    lastFailure = `mismatched ${failures.join(", ")}`;
                  }
                } catch (error) {
                  lastFailure = error instanceof Error ? error.message : String(error);
                }

                if (attempt < 30) {
                  await new Promise((resolve) => setTimeout(resolve, 10_000));
                }
              }

              throw new Error(
                `${row.label} preview does not match the validated ${headSha} artifact contract: ${lastFailure}`
              );
            }

            const manifestUrls = await Promise.all(rows.map(verifyDeployedPreview));
            rows.forEach((row, index) => {
              row.manifestUrl = manifestUrls[index];
            });

            core.info(
              commitPreviewEnabled
                ? "Publishing verified mainnet preview links in the job summary; missing commit URLs remain pending."
                : "Publishing verified Cloudflare branch preview URLs in the job summary; commit preview links hidden by PR setting."
            );

            const branchTable = [
              "| App | URL | Verified config |",
              "|-----|-----|-----------------|",
              ...rows.map((row) => `| ${row.label} | ${row.branchUrl} | [preview manifest](${row.manifestUrl}) |`),
            ].join("\n");

            const commitTable = [
              "| App | URL |",
              "|-----|-----|",
              ...rows.map((row) => `| ${row.label} | ${row.commitUrl || "_pending_"} |`),
            ].join("\n");
            const commitDetailsBlock = commitPreviewEnabled
              ? [
                  "<details>",
                  "<summary>Commit-Level URLs</summary>",
                  "",
                  commitTable,
                  "",
                  "</details>",
                ].join("\n")
              : "_Commit-level preview links are hidden by PR setting (`- [ ] Show commit-level mainnet preview links (Cloudflare creates deployments automatically)`)._";

            const previewSummary = [
              "## Preview Deploys",
              "",
              `- Source commit: ${headSha}`,
              `- Last applied: ${updatedAt}`,
              `- Workflow run: ${runUrl}`,
              "",
              "### Mainnet Branch URLs",
              "",
              branchTable,
              "",
              commitDetailsBlock,
            ].join("\n");
            await core.summary.addRaw(previewSummary).write();
