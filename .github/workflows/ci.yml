name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-mainnet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CONDUIT_DEPLOYMENT_PROFILE: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      VITE_BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      VITE_BUILD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.5"
      - run: bun install --frozen-lockfile
      - name: Build validated deployment profile
        run: bun run build
      - name: Verify compiled deployment manifests
        run: bun scripts/ci/verify_deployment_artifacts.ts "$CONDUIT_DEPLOYMENT_PROFILE"
