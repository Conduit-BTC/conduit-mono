name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  payment-recovery-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - run: bun install --frozen-lockfile
      - name: Reject new runtime dependency cycles
        run: bun run cycles:check
      - name: Run payment, recovery, and gateway release tests
        run: bun test

  public-feed-browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - run: bun install --frozen-lockfile
      - run: bunx --no-install playwright install --with-deps chromium
      - name: Verify isolated public feed destinations
        run: bun run test:browser -- public-feeds.pw.ts public-event-feeds.pw.ts

  build-mainnet:
    needs: [payment-recovery-tests, public-feed-browser-tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CONDUIT_DEPLOYMENT_PROFILE: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      VITE_BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      VITE_BUILD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - name: Require successful read and payment tests
        env:
          TEST_RESULT: ${{ needs.payment-recovery-tests.result }}
          FEED_RESULT: ${{ needs.public-feed-browser-tests.result }}
        run: test "$TEST_RESULT" = success && test "$FEED_RESULT" = success
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - run: bun install --frozen-lockfile
      - name: Build validated deployment profile
        run: bun run build
      - name: Verify compiled deployment manifests
        run: bun scripts/ci/verify_deployment_artifacts.ts "$CONDUIT_DEPLOYMENT_PROFILE"
