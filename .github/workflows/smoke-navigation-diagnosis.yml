name: Smoke navigation diagnosis
on:
  push:
    branches: [test/smoke-navigation-diagnosis-654]
permissions:
  contents: read
jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --init --shm-size=1g
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      DEBUG: pw:browser
      PLAYWRIGHT_SMOKE_AREA: merchant
      PLAYWRIGHT_SMOKE_RESULT_FILE: /tmp/navigation-results.json
      PLAYWRIGHT_SMOKE_PROGRESS_FILE: /tmp/navigation-progress.log
      PLAYWRIGHT_SMOKE_BASE_SHA: 709a973d7cf7c331f7be11ee24c59d001a8f71a6
      PLAYWRIGHT_SMOKE_SOURCE_HEAD_SHA: 3349cf269d6f13ba91b9673e684ed6867eddddd9
      PLAYWRIGHT_SMOKE_TESTED_SHA: 3349cf269d6f13ba91b9673e684ed6867eddddd9
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 3349cf269d6f13ba91b9673e684ed6867eddddd9
          persist-credentials: false
      - name: Prepare pinned runtime
        run: |
          npm install --global bun@1.3.5
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bun install --frozen-lockfile
      - name: Apply readiness-probe cleanup and observe socket failures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("e2e/shared-ui-surface-audit.playwright.ts")
          s = p.read_text()
          s = 'import { appendFileSync } from "node:fs"\n' + s
          needle = "      let failedDocuments = 0"
          addition = '''
                page.on("websocket", (socket) => {
                  socket.on("socketerror", (error) => {
                    appendFileSync(process.env.PLAYWRIGHT_SMOKE_PROGRESS_FILE!, "[DEBUG-nav654-socket] " + JSON.stringify({
                      routeIndex,
                      networkProcessCrashed: /Network process crashed/i.test(error),
                    }) + "\\n")
                  })
                })'''
          addition = addition.replace("\n                ", "\n      ")
          assert s.count(needle) == 1
          s = s.replace(needle, needle + addition)
          before = "            releaseImage()"
          after = '''            const probeFinished = page.waitForEvent("requestfinished", (request) =>
                        new URL(request.url()).pathname === "/__surface_readiness_probe.svg"
                      )
                      releaseImage()
                      await probeFinished
                      await page.unroute("**/__surface_readiness_probe.svg")'''
          after = after.replace("\n                      ", "\n            ")
          assert s.count(before) == 1
          p.write_text(s.replace(before, after))
          PY
      - name: Run predecessor sequence six times with zero retries
        run: |
          set -euo pipefail
          umask 077
          cat > /tmp/navigation-monitor.py <<'PY'
          import glob, json, os, time
          started = time.monotonic()
          previous = set()
          born = gone = 0
          last = -10
          while True:
              current = set()
              rss = 0
              for path in glob.glob("/proc/[0-9]*/comm"):
                  try:
                      comm = open(path).read().strip()
                      if not comm.startswith(("WebKitNetwork", "WPENetwork")):
                          continue
                      parent = os.path.dirname(path)
                      stat = open(parent + "/stat").read().rsplit(")", 1)[1].split()
                      current.add((parent, stat[19]))
                      rss += int(stat[21]) * os.sysconf("SC_PAGE_SIZE")
                  except (OSError, ValueError, IndexError):
                      continue
              born += len(current - previous)
              gone += len(previous - current)
              elapsed = int(time.monotonic() - started)
              if current != previous or elapsed - last >= 10:
                  memory = -1
                  oom_kills = -1
                  try:
                      memory = int(open("/sys/fs/cgroup/memory.current").read()) // 1048576
                  except (OSError, ValueError):
                      pass
                  try:
                      events = dict(line.split() for line in open("/sys/fs/cgroup/memory.events"))
                      oom_kills = int(events.get("oom_kill", "-1"))
                  except (OSError, ValueError):
                      pass
                  print("[DEBUG-nav654] " + json.dumps({"elapsed": elapsed, "networkProcesses": len(current), "born": born, "gone": gone, "networkRssMiB": rss // 1048576, "containerMiB": memory, "oomKills": oom_kills}), flush=True)
                  last = elapsed
              previous = current
              time.sleep(0.25)
          PY
          : > "$PLAYWRIGHT_SMOKE_PROGRESS_FILE"
          tail -n +1 -f "$PLAYWRIGHT_SMOKE_PROGRESS_FILE" &
          progress_pid=$!
          python3 /tmp/navigation-monitor.py &
          monitor_pid=$!
          trap 'sleep 1; kill "$progress_pid" "$monitor_pid" 2>/dev/null || true' EXIT
          bunx playwright test e2e/mobile-safari-baseline.playwright.ts:2578 e2e/mobile-safari-baseline.playwright.ts:2613 e2e/mobile-safari-baseline.playwright.ts:2636 e2e/shared-ui-populated-audit.playwright.ts e2e/shared-ui-surface-audit.playwright.ts --project=mobile-webkit --repeat-each=6 --workers=1 --retries=0 >/dev/null 2>&1
      - name: Remove transient output
        if: always()
        run: |
          rm -f /tmp/navigation-monitor.py /tmp/navigation-manifest.json "$PLAYWRIGHT_SMOKE_RESULT_FILE" "$PLAYWRIGHT_SMOKE_PROGRESS_FILE"
          rm -rf playwright-report test-results
