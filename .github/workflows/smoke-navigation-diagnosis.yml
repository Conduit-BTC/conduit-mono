name: Smoke navigation diagnosis
on:
  push:
    branches: [test/smoke-navigation-diagnosis-654]
permissions:
  contents: read
jobs:
  diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sample: [original, positioned]
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --init --shm-size=1g
    defaults:
      run:
        shell: bash
    env:
      SAMPLE_KIND: ${{ matrix.sample }}
      CI: "true"
      PLAYWRIGHT_SMOKE_AREA: merchant
      PLAYWRIGHT_SMOKE_RESULT_FILE: /tmp/dialog-results.json
      PLAYWRIGHT_SMOKE_PROGRESS_FILE: /tmp/dialog-progress.log
      PROBE_FILE: /tmp/dialog-probes.log
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: f1102ec9a0a1268e8c1dd239957cae86eae3fc28
          persist-credentials: false
      - name: Prepare pinned runtime
        run: |
          npm install --global bun@1.3.5
          bun install --frozen-lockfile
      - name: Add bounded diagnostic probes
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path("e2e/merchant-shipping-tables.playwright.ts");s=p.read_text()
          old="  if (testInfo.project.use.hasTouch) await add.tap()\n  else await add.click()\n  const dialog = page.getByRole(\"dialog\", { name: \"Add product\" })\n  await expect(dialog).toBeVisible()"
          new="  const probe = await add.evaluateHandle(element => {\n    const events: Record<string, unknown>[] = []\n    const listeners = [\"pointerdown\", \"pointerup\", \"click\"].map(type => {\n      const listener = (event: Event) => {\n        const box = element.getBoundingClientRect()\n        events.push({type,onTrigger:event.target instanceof Node && element.contains(event.target),enabled:!element.hasAttribute(\"disabled\"),fonts:document.fonts.status,scrollY:window.scrollY,clientX:(event as PointerEvent).clientX,clientY:(event as PointerEvent).clientY,x:box.x,y:box.y,width:box.width,height:box.height})\n      }\n      document.addEventListener(type,listener,true)\n      return {type,listener}\n    })\n    let mounted=false,removed=false\n    const containsDialog=(node:Node)=>node instanceof Element && (node.matches('[role=\"dialog\"]') || !!node.querySelector('[role=\"dialog\"]'))\n    const observer=new MutationObserver(changes=>{for(const change of changes){if([...change.addedNodes].some(containsDialog))mounted=true;if([...change.removedNodes].some(containsDialog))removed=true}})\n    observer.observe(document,{childList:true,subtree:true})\n    return {read(){return {gate:(window as any).__dialogOpenGate ?? {called:false},events,mounted,removed,present:!!document.querySelector('[role=\"dialog\"]'),fonts:document.fonts.status}},dispose(){observer.disconnect();for(const {type,listener} of listeners)document.removeEventListener(type,listener,true)}}\n  })\n  const dialog = page.getByRole(\"dialog\", { name: \"Add product\" })\n  try {\n    if (testInfo.project.use.hasTouch) await add.tap()\n    else await add.click()\n    await expect(dialog).toBeVisible()\n  } finally {\n    appendFileSync(process.env.PROBE_FILE!,JSON.stringify(await probe.evaluate(p=>p.read()))+\"\\n\")\n    await probe.evaluate(p=>p.dispose())\n    await probe.dispose()\n  }\n"
          assert s.count(old)==1
          s=s.replace(old,new)
          if os.environ["SAMPLE_KIND"] == "positioned":
              seam="  const add = page.getByRole(\"button\", { name: \"Add product\" }).first()"
              assert s.count(seam)==1
              s=s.replace(seam,seam+"\n"+"  await add.evaluate(element => element.scrollIntoView({ behavior: \"instant\", block: \"center\" }))\n")
          p.write_text("import { appendFileSync } from \"node:fs\"\n"+s)
          p=Path("apps/merchant/src/routes/products.tsx");s=p.read_text()
          seam="  function openCreateDialog(): void {"
          assert s.count(seam)==1
          p.write_text(s.replace(seam,seam+"\n    ;(window as any).__dialogOpenGate = { called:true,authConnected:authStatus===\"connected\",shippingLoading:signedShippingQuery.isLoading,policyLoading:signedPolicyQuery.isLoading }"))
          PY
      - name: Reproduce with zero retries
        run: |
          set -euo pipefail
          umask 077
          : > "$PLAYWRIGHT_SMOKE_PROGRESS_FILE"
          : > "$PROBE_FILE"
          tail -n +1 -f "$PLAYWRIGHT_SMOKE_PROGRESS_FILE" "$PROBE_FILE" &
          progress_pid=$!
          trap 'sleep 1; kill "$progress_pid" 2>/dev/null || true' EXIT
          bunx playwright test e2e/merchant-shipping-tables.playwright.ts --grep 'digital drafts publish' --project=mobile-chromium --repeat-each=24 --workers=1 --retries=0 >/dev/null 2>&1
      - name: Remove transient output
        if: always()
        run: |
          rm -f "$PLAYWRIGHT_SMOKE_RESULT_FILE" "$PLAYWRIGHT_SMOKE_PROGRESS_FILE" "$PROBE_FILE"
          rm -rf playwright-report test-results
