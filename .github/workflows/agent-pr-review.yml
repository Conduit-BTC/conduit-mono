name: Agent PR Review

on:
  pull_request:
    types: [opened, reopened, edited, synchronize, ready_for_review]
    branches: [main]
  pull_request_review_comment:
    types: [created, edited]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: agent-pr-review-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number || github.ref }}
  cancel-in-progress: false

jobs:
  review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login != 'dependabot[bot]') ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.comment.body == '/agent review' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
        github.event.comment.body == '/agent review' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate pull request
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
        run: |
          set -euo pipefail

          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "Pull request number must be a positive integer." >&2
            exit 1
          fi

          metadata="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json baseRefName,headRefOid,isCrossRepository,isDraft,state \
            --jq '[.baseRefName // "", .headRefOid // "", ((.isCrossRepository == true) | tostring), ((.isDraft == true) | tostring), .state // ""] | join("\u001f")')"
          IFS=$'\x1f' read -r base_ref head_sha is_cross_repo is_draft state <<< "$metadata"

          if [[ "$is_cross_repo" == "true" ]]; then
            echo "Agent review is disabled for cross-repository pull requests." >&2
            exit 1
          fi
          if [[ "$base_ref" != "main" ]]; then
            echo "Agent review requires a pull request targeting main." >&2
            exit 1
          fi
          if [[ "$is_draft" == "true" ]]; then
            echo "Agent review requires a ready pull request." >&2
            exit 1
          fi
          if [[ "$state" != "OPEN" || -z "$head_sha" ]]; then
            echo "Agent review requires an open pull request with a resolvable head SHA." >&2
            exit 1
          fi

          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Require automation credentials
        shell: bash
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          GITHUB_APP_CLIENT_ID: ${{ vars.WORKFLOW_AGENT_GITHUB_APP_CLIENT_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.WORKFLOW_AGENT_GITHUB_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$CODEX_AUTH_JSON" ]] || { echo "CODEX_AUTH_JSON is required." >&2; exit 1; }
          [[ -n "$GITHUB_APP_CLIENT_ID" ]] || { echo "WORKFLOW_AGENT_GITHUB_APP_CLIENT_ID is required." >&2; exit 1; }
          [[ -n "$GITHUB_APP_PRIVATE_KEY" ]] || { echo "WORKFLOW_AGENT_GITHUB_APP_PRIVATE_KEY is required." >&2; exit 1; }

      - name: Checkout immutable pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.pr.outputs.head_sha }}

      - name: Create GitHub App review token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.WORKFLOW_AGENT_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.WORKFLOW_AGENT_GITHUB_APP_PRIVATE_KEY }}
          permission-actions: read
          permission-contents: read
          permission-pull-requests: write

      - name: Run Sudden Agent review
        uses: sudden-network/agent@2afabe84ac9bf58e57f605b41b2c4f87bbe9c579 # v1.14.1
        with:
          agent_auth_file: ${{ secrets.CODEX_AUTH_JSON }}
          github_token: ${{ steps.app_token.outputs.token }}
          github_token_actor: ${{ format('{0}[bot]', steps.app_token.outputs['app-slug']) }}
          model: gpt-5.4/xhigh
          resume: false
          prompt: |
            Perform a fresh, read-only correctness review of
            Conduit-BTC/conduit-mono PR #${{ steps.pr.outputs.number }} at head
            ${{ steps.pr.outputs.head_sha }}. Review the complete base-to-head
            diff. Do not edit files, push commits, create branches, change
            labels, merge, deploy, request reviewers, or update external systems.

            Read AGENTS.md, contributor guidance, the changed files, their
            callers, and applicable public implementation context before
            judging the diff.

            Review priorities:
            1. Functional correctness and regressions.
            2. Protocol, authentication, privacy, and payment constraints.
            3. Reliability and failure-mode handling.
            4. Test coverage and verifiability.
            5. Maintainability.

            Mandatory constraints:
            - User authentication remains external-signer-only. Service-signer
              exceptions must be documented and narrowly scoped.
            - Do not introduce behavioral tracking, profiling, or message,
              order, payment, address, signer, or wallet secret inspection.
            - Payments remain non-custodial.
            - Telemetry follows docs/analytics/events.md.
            - Public repository content excludes private runbooks, credentials,
              dashboard exports, and private company planning context.

            Review delivery contract:
            - Submit review feedback through GitHub pull request reviews, not PR
              Conversation or issue comments.
            - Use `github.octokit_request` with
              `POST /repos/{owner}/{repo}/pulls/{pull_number}/reviews` for the
              final review. Include `event: "COMMENT"`,
              `commit_id: "${{ steps.pr.outputs.head_sha }}"`, and a concise
              `body`.
            - Every actionable P0, P1, or P2 finding must be an inline review
              comment on a changed file and line. Use `comments[].body`,
              `comments[].path`, `comments[].line`, and `comments[].side`.
              Use `"RIGHT"` for additions or context and `"LEFT"` for deletions.
            - Anchor multi-file findings on the primary changed line and name
              related files in that inline comment.
            - Keep the review body to a concise summary, the reviewer-owned
              public-context decision, and residual test or release risks. Do
              not duplicate actionable finding detail there.
            - If an inline review cannot be submitted, leave no top-level
              finding and state the delivery blocker in the review body.

            Clean-review handoff contract:
            - If and only if there are zero actionable P0, P1, or P2 findings,
              include this exact marker in the review body:
              `<!-- conduit:sudden-review clean head=${{ steps.pr.outputs.head_sha }} -->`
            - A clean review must have zero inline comments. State
              `No actionable findings.` and list only residual verification
              risks after the marker.
            - Never include the clean marker when any actionable finding exists
              or review delivery is blocked.
