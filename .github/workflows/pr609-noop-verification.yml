# Isolated hosted verification of PR #609 at b0f2e8f48fc04c3264f1e1f4cd6f1361e68ac619.
# Smoke shard and aggregate jobs below are copied verbatim from that frozen head.
name: PR 609 no-op verification
on:
  push:
    branches: [chore/pr609-noop-verification]
permissions:
  contents: read
jobs:
  smoke-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.select.outputs.shards }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"
      - name: Select documentation-only and unit-test-only no-op cases
        id: select
        shell: bash
        run: |
          set -euo pipefail
          bun -e 'import { expandSmokeMatrix, selectSmokeShards } from "./scripts/ci/select_smoke_shards.ts"
          const cases = [
            { case: "documentation", paths: ["docs/knowledge/testing.md"] },
            { case: "unit-tests", paths: ["tests/cart-model.test.ts"] },
          ]
          const matrix = cases.flatMap(({case: label, paths}) => {
            const jobs = expandSmokeMatrix(selectSmokeShards(paths))
            if (jobs.length !== 1 || jobs[0].area !== "none") throw new Error("Expected no-op selection")
            return jobs.map(job => ({...job, case: label}))
          })
          console.log("shards=" + JSON.stringify(matrix))' >> "$GITHUB_OUTPUT"

  e2e-smoke-shard:
    name: e2e-smoke / ${{ matrix.job.id }}
    needs: [smoke-changes]
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.smoke-changes.outputs.shards) }}
    runs-on: ubuntu-latest
    # Keep this version aligned with the locked @playwright/test dependency.
    # Preinstalled browsers/libraries avoid slow apt downloads on every shard.
    container:
      image: ${{ matrix.job.area != 'none' && 'mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e' || '' }}
      options: --init --shm-size=1g
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    steps:
      - name: No browser smoke needed
        if: matrix.job.area == 'none'
        run: echo "No browser-facing runtime paths changed."
      - uses: actions/checkout@v7.0.1
        if: matrix.job.area != 'none'
        with:
          persist-credentials: false
      - name: Set up Bun and checkout ownership
        if: matrix.job.area != 'none'
        run: |
          set -euo pipefail
          # The Playwright image has npm, but not setup-bun's unzip dependency.
          npm install --global bun@1.3.5
          bun --version
          # GitHub mounts the checkout with a different owner inside the image.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - if: matrix.job.area != 'none'
        run: bun install --frozen-lockfile
      - name: Validate Playwright smoke area assignments
        if: matrix.job.area != 'none'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PLAYWRIGHT_SMOKE_MANIFEST: playwright-smoke-${{ matrix.job.id }}-manifest.json
          PLAYWRIGHT_SMOKE_SHARD: ${{ matrix.job.shard }}
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          checkout_sha="$(git rev-parse HEAD)"
          if [[ "$checkout_sha" != "$TESTED_SHA" ]]; then
            echo "The checked-out SHA does not match the workflow-tested SHA." >&2
            exit 1
          fi
          shard_args=()
          if [[ -n "$PLAYWRIGHT_SMOKE_SHARD" ]]; then
            shard_args=(--shard "$PLAYWRIGHT_SMOKE_SHARD")
          fi
          bun run test:e2e:areas \
            --area '${{ matrix.job.area }}' \
            "${shard_args[@]}" \
            --manifest-output "$PLAYWRIGHT_SMOKE_MANIFEST" \
            --source-head-sha "$SOURCE_HEAD_SHA" \
            --base-sha "$BASE_SHA" \
            --tested-sha "$checkout_sha"
      - name: Run ${{ matrix.job.id }} Playwright smoke tests
        if: matrix.job.area != 'none'
        env:
          PLAYWRIGHT_SMOKE_AREA: ${{ matrix.job.area }}
          PLAYWRIGHT_SMOKE_SHARD: ${{ matrix.job.shard }}
          PLAYWRIGHT_SMOKE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PLAYWRIGHT_SMOKE_RESULT_FILE: ${{ runner.temp }}/playwright-smoke-${{ matrix.job.id }}-results.json
          PLAYWRIGHT_SMOKE_PROGRESS_FILE: ${{ runner.temp }}/playwright-smoke-${{ matrix.job.id }}-progress.log
          PLAYWRIGHT_SMOKE_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PLAYWRIGHT_SMOKE_TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          : > "$PLAYWRIGHT_SMOKE_PROGRESS_FILE"
          tail -n +1 -f "$PLAYWRIGHT_SMOKE_PROGRESS_FILE" &
          progress_pid=$!
          trap 'sleep 1; kill "$progress_pid" 2>/dev/null || true' EXIT
          if [[ -n "$PLAYWRIGHT_SMOKE_SHARD" ]]; then
            bunx playwright test --shard="$PLAYWRIGHT_SMOKE_SHARD" >/dev/null 2>&1
          else
            bunx playwright test >/dev/null 2>&1
          fi
      - name: Verify executed ${{ matrix.job.id }} Playwright smoke evidence
        if: always() && matrix.job.area != 'none'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PLAYWRIGHT_SMOKE_MANIFEST: playwright-smoke-${{ matrix.job.id }}-manifest.json
          PLAYWRIGHT_SMOKE_RESULT_FILE: ${{ runner.temp }}/playwright-smoke-${{ matrix.job.id }}-results.json
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          checkout_sha="$(git rev-parse HEAD)"
          if [[ "$checkout_sha" != "$TESTED_SHA" ]]; then
            echo "The checked-out SHA changed during Playwright execution." >&2
            exit 1
          fi
          bun run test:e2e:areas \
            --area '${{ matrix.job.area }}' \
            --expected-manifest "$PLAYWRIGHT_SMOKE_MANIFEST" \
            --execution-report "$PLAYWRIGHT_SMOKE_RESULT_FILE" \
            --source-head-sha "$SOURCE_HEAD_SHA" \
            --base-sha "$BASE_SHA" \
            --tested-sha "$checkout_sha"
      - name: Remove raw Playwright output
        if: always() && matrix.job.area != 'none'
        env:
          PLAYWRIGHT_SMOKE_RESULT_FILE: ${{ runner.temp }}/playwright-smoke-${{ matrix.job.id }}-results.json
          PLAYWRIGHT_SMOKE_PROGRESS_FILE: ${{ runner.temp }}/playwright-smoke-${{ matrix.job.id }}-progress.log
        run: |
          rm -f -- "$PLAYWRIGHT_SMOKE_RESULT_FILE" "$PLAYWRIGHT_SMOKE_PROGRESS_FILE"
          rm -rf -- "$GITHUB_WORKSPACE/playwright-report" "$GITHUB_WORKSPACE/test-results"
  e2e-smoke:
    name: e2e-smoke
    if: always()
    needs: [smoke-changes, e2e-smoke-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify selected smoke shards
        env:
          SELECT_RESULT: ${{ needs.smoke-changes.result }}
          SHARD_RESULT: ${{ needs.e2e-smoke-shard.result }}
          SHARDS: ${{ needs.smoke-changes.outputs.shards }}
        run: |
          set -euo pipefail

          if [[ "$SELECT_RESULT" != "success" ]]; then
            echo "Smoke shard selection did not succeed: $SELECT_RESULT"
            exit 1
          fi
          if [[ "$SHARD_RESULT" != "success" ]]; then
            echo "Smoke shards did not complete successfully: $SHARD_RESULT"
            exit 1
          fi

          echo "Smoke shard result: $SHARD_RESULT for $SHARDS"

